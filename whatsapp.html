<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Contact Support</title>

<link rel="icon" href="../image/default-avatar.jpg">

<link rel="stylesheet" href="whatsapp.css">
<link rel="stylesheet" href="bottom.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">


<!-- WhatsApp -->

<div class="support-card whatsapp">

<div class="left">

<div class="icon">
<i class="fab fa-whatsapp"></i>
</div>

<div>

<h3>WhatsApp</h3>

<span>Fast Reply</span>

</div>

</div>

<button
class="support-btn"
id="whatsappBtn">

CHAT NOW

</button>

</div>

<!-- Gmail -->

<div class="support-card gmail">

<div class="left">

<div class="icon">
<i class="fas fa-envelope"></i>
</div>

<div>

<h3>Gmail</h3>

<span>Email Support</span>

</div>

</div>

<button
class="support-btn"
id="gmailBtn">

SEND MAIL

</button>

</div>

<!-- Discord -->

<div class="support-card discord">

<div class="left">

<div class="icon">
<i class="fab fa-discord"></i>
</div>

<div>

<h3>Discord</h3>

<span>Community Support</span>

</div>

</div>

<button
class="support-btn"
id="discordBtn">

JOIN SERVER

</button>

</div>

</div>

<div id="bottomNav"></div>

<script src="bottom.js"></script>
<script type="module" src="whatsapp.js"></script>

</body>
</html>
