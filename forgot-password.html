<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link rel="stylesheet" href="forgot-password.css">

<style>
html,body,*{
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.back-link{
margin-top:15px;
text-align:center;
}

.back-link a{
text-decoration:none;
}

.hidden{
display:none;
}
</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="login-header">

<div class="neu-icon">
<div class="icon-inner">
🔐
</div>
</div>

<h2>Forgot Password</h2>

<p>
Verify your email to reset your password
</p>

</div>


<div id="step1">

<div class="form-group">

<div class="input-group neu-input">

<input
type="email"
id="email"
placeholder=" "
required>

<label>Email Address</label>

</div>

</div>

<button
class="neu-button login-btn"
onclick="sendOTP()">

Send Verification Code

</button>

</div>



<div id="step2" class="hidden">

<div class="form-group">

<div class="input-group neu-input">

<input
type="text"
id="otp"
maxlength="6"
placeholder=" ">

<label>Verification Code</label>

</div>

</div>

<button
class="neu-button login-btn"
onclick="verifyOTP()">

Verify Code

</button>

</div>



<div id="step3" class="hidden">

<div class="form-group">

<div class="input-group neu-input">

<input
type="password"
id="newPassword"
placeholder=" ">

<label>New Password</label>

</div>

</div>


<div class="form-group">

<div class="input-group neu-input">

<input
type="password"
id="confirmPassword"
placeholder=" ">

<label>Confirm Password</label>

</div>

</div>

<button
class="neu-button login-btn"
onclick="updatePassword()">

Update Password

</button>

</div>


<p id="msg"></p>

<div class="back-link">

<a href="login.html">

← Back to Login

</a>

</div>

</div>

</div>

<script type="module" src="forgot-password.js"></script>

</body>
</html>
