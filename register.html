<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PHOENIX TK</title>
<link rel="stylesheet" href="register.css?v=2">
<link rel="icon" href="../image/default-avatar.jpg">

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="login-header">
<h2>Create Account</h2>
<p>Sign up to continue</p>
</div>

<form id="registerForm" class="login-form">

<div class="form-group">
<div class="input-group neu-input">

<input type="text" id="username" required placeholder=" ">
<label>Username</label>

</div>
</div>

<div class="form-group">
<div class="input-group neu-input">

<input type="email" id="email" required placeholder=" ">
<label>Email address</label>

</div>
</div>

<div class="form-group">
<div class="input-group neu-input">

<input type="password" id="password" required placeholder=" ">
<label>Password</label>

</div>
</div>

<button type="submit" class="neu-button login-btn">
Create Account
</button>


<p id="successMsg" class="success-msg" style="display:none;color:red;">
Account Created Successfully ✅
</p>


</form>

<div class="signup-link">
<p>
Already have an account?
<a href="login.html">Login</a>
</p>
</div>

</div>

</div>

<!-- =========================================
     PREMIUM MESSAGE POPUP
========================================= -->

<div id="premiumAlert" class="premium-alert-overlay">

  <div class="premium-alert-card">

    <div class="premium-alert-icon">
      <span>!</span>
    </div>

    <h3 id="premiumAlertTitle">
      Password Required
    </h3>

    <p id="premiumAlertMessage">
      Password must be at least 8 characters.
    </p>

    <button
      type="button"
      id="premiumAlertBtn"
      class="premium-alert-btn">
      OK
    </button>

  </div>

</div>

<!-- OTP POPUP -->

<div id="otpPopup" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
align-items:center;
justify-content:center;
">

  <div style="
  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  width:300px;
  ">

    <h3>Enter your OTP</h3>

    <p>Check your Primary box OR spam box</p>

    <input 
      type="text" 
      id="otpInput"
      maxlength="6"
      placeholder="6 Digit OTP"
      style="
      width:90%;
      padding:12px;
      font-size:18px;
      text-align:center;
      "
    >

    <br><br>

    <button
      id="verifyOtpBtn"
      class="neu-button">
      Verify OTP
    </button>

    <p id="otpTimer" style="color:red;"></p>

    <button
      id="resendOtpBtn"
      class="neu-button"
      disabled>
      Resend OTP
    </button>

  </div>

</div>


<!-- OTP POPUP -->

<div id="otpPopup" style="
display:none;

top:0;

background:rgba(0,0,0,0.7);

<input

style="
width:90%;

"
>

<br><br>

<button id="verifyOtpBtn" class="neu-button">
Verify OTP
</button>

<p id="otpTimer" style="color:red;"></p>

<button id="resendOtpBtn" class="neu-button" disabled>
Resend OTP
</button>

</div>

</div>

<script type="module" src="register.js"></script>

</body>

</html>
