<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Phoenix—Admin</title>

<link rel="icon" href="../image/default-avatar.jpg">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

/* =========================================
   PHOENIX STORE — ADMIN LOGIN
   PREMIUM RED / BLACK GAMING UI
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}


/* =========================================
   BODY
========================================= */

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    color:#fff;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,0,30,.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(255,0,30,.10),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            #080808,
            #020202
        );

    position:relative;
}


/* =========================================
   BACKGROUND GLOW
========================================= */

.neon-bg{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:0;
}


.neon-bg::before{

    content:"";

    position:absolute;

    width:420px;
    height:420px;

    top:-180px;
    left:-180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,30,.18),
            transparent 70%
        );

    filter:blur(15px);

    animation:
        floatGlow 7s ease-in-out infinite alternate;
}


.neon-bg::after{

    content:"";

    position:absolute;

    width:450px;
    height:450px;

    right:-200px;
    bottom:-200px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,20,40,.13),
            transparent 70%
        );

    filter:blur(18px);

    animation:
        floatGlow2 8s ease-in-out infinite alternate;
}


@keyframes floatGlow{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(80px,60px);
    }
}


@keyframes floatGlow2{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-70px,-50px);
    }
}


/* =========================================
   BACKGROUND GRID
========================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.18;

    background-image:

        linear-gradient(
            rgba(255,30,45,.08) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,30,45,.08) 1px,
            transparent 1px
        );

    background-size:
        45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            #000 30%,
            #000 70%,
            transparent
        );

    z-index:0;
}


/* =========================================
   LOGIN WRAPPER
========================================= */

.login-wrapper{

    width:100%;

    max-width:430px;

    padding:22px;

    position:relative;

    z-index:2;

    animation:
        pageEnter .65s ease;
}


@keyframes pageEnter{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================
   LOGIN CARD
========================================= */

.login-box{

    position:relative;

    width:100%;

    padding:
        34px 28px 30px;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(24,24,27,.98),
            rgba(7,7,8,.98)
        );

    border:
        1px solid rgba(255,30,45,.42);

    box-shadow:

        0 25px 70px rgba(0,0,0,.85),

        0 0 35px rgba(255,0,30,.08),

        inset 0 0 35px rgba(255,0,30,.025);

    backdrop-filter:blur(18px);

    overflow:hidden;
}


/* =========================================
   CARD TOP RED LINE
========================================= */

.login-box::before{

    content:"";

    position:absolute;

    top:0;
    left:8%;

    width:84%;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1e2d,
            #ff5964,
            #ff1e2d,
            transparent
        );

    box-shadow:
        0 0 14px #ff1e2d;
}


/* =========================================
   CORNER GLOW
========================================= */

.login-box::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-110px;
    top:-110px;

    background:
        radial-gradient(
            circle,
            rgba(255,30,45,.17),
            transparent 70%
        );

    pointer-events:none;
}


/* =========================================
   BRAND ICON
========================================= */

.brand-icon{

    width:78px;
    height:78px;

    margin:
        0 auto 17px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #ff2638,
            #9b0010
        );

    border:
        1px solid rgba(255,100,110,.55);

    box-shadow:

        0 0 20px rgba(255,20,35,.45),

        0 0 45px rgba(255,0,30,.15),

        inset 0 0 18px rgba(255,255,255,.10);

    font-size:37px;

    position:relative;

    animation:
        iconPulse 3s ease-in-out infinite;
}


@keyframes iconPulse{

    0%,
    100%{
        transform:scale(1);

        box-shadow:
            0 0 20px rgba(255,20,35,.40),
            0 0 40px rgba(255,0,30,.12);
    }

    50%{
        transform:scale(1.04);

        box-shadow:
            0 0 28px rgba(255,20,35,.60),
            0 0 55px rgba(255,0,30,.20);
    }
}


/* =========================================
   BRAND
========================================= */

.brand-name{

    text-align:center;

    font-size:25px;

    font-weight:950;

    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 12px rgba(255,30,45,.25);
}


.brand-subtitle{

    margin-top:6px;

    text-align:center;

    color:#8f8f94;

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;
}


/* =========================================
   ADMIN BADGE
========================================= */

.admin-badge{

    width:max-content;

    margin:
        18px auto 26px;

    padding:
        7px 13px;

    display:flex;

    align-items:center;

    gap:7px;

    border-radius:999px;

    background:
        rgba(255,30,45,.08);

    border:
        1px solid rgba(255,30,45,.25);

    color:#ff4653;

    font-size:10px;

    font-weight:900;

    letter-spacing:1.4px;
}


.admin-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff1e2d;

    box-shadow:
        0 0 8px #ff1e2d;

    animation:
        dotPulse 1.5s infinite;
}


@keyframes dotPulse{

    0%,
    100%{
        opacity:1;
    }

    50%{
        opacity:.35;
    }
}


/* =========================================
   INPUT GROUP
========================================= */

.input-group{

    position:relative;

    margin-bottom:16px;
}


.input-icon{

    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    color:#ff4653;

    font-size:15px;

    pointer-events:none;

    z-index:2;
}


input{

    width:100%;

    height:54px;

    padding:
        0 15px 0 44px;

    border-radius:14px;

    outline:none;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #151517,
            #09090a
        );

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.35);

    font-size:14px;

    transition:
        border-color .25s,
        box-shadow .25s,
        background .25s;
}


input::placeholder{

    color:#707078;
}


input:focus{

    border-color:
        rgba(255,30,45,.75);

    background:
        linear-gradient(
            145deg,
            #19191b,
            #0a0a0b
        );

    box-shadow:

        0 0 0 3px
        rgba(255,30,45,.07),

        0 0 18px
        rgba(255,30,45,.10),

        inset 0 0 15px
        rgba(255,0,30,.025);
}


/* =========================================
   PASSWORD WRAPPER
========================================= */

.password-wrap{

    position:relative;
}


.password-wrap input{

    padding-right:48px;
}


.toggle-password{

    position:absolute;

    right:14px;
    top:50%;

    transform:
        translateY(-50%);

    width:30px;
    height:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:none;

    background:transparent;

    color:#777;

    cursor:pointer;

    font-size:15px;

    transition:.2s;
}


.toggle-password:hover{

    color:#ff4653;

    transform:
        translateY(-50%)
        scale(1.08);
}


/* =========================================
   LOGIN BUTTON
========================================= */

.login-btn{

    width:100%;

    height:54px;

    margin-top:7px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff2638,
            #b00014
        );

    border:
        1px solid rgba(255,90,100,.40);

    box-shadow:

        0 9px 25px
        rgba(255,0,30,.20),

        inset 0 0 10px
        rgba(255,255,255,.06);

    font-size:15px;

    font-weight:900;

    letter-spacing:.4px;

    transition:
        transform .2s,
        box-shadow .2s,
        filter .2s;
}


.login-btn:hover{

    filter:brightness(1.08);

    box-shadow:

        0 12px 30px
        rgba(255,0,30,.35),

        0 0 18px
        rgba(255,30,45,.18);
}


.login-btn:active{

    transform:scale(.97);
}


.login-btn.loading{

    pointer-events:none;

    opacity:.75;
}


/* =========================================
   SECURITY FOOTER
========================================= */

.security-note{

    margin-top:20px;

    padding-top:18px;

    border-top:
        1px solid rgba(255,255,255,.06);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    color:#68686f;

    font-size:10px;

    letter-spacing:.3px;

    text-align:center;
}


.security-note span{

    color:#85858d;
}


.security-note i{

    color:#ff4653;
}


/* =========================================
   DESKTOP DECORATION
========================================= */

.side-line{

    position:fixed;

    width:80px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1e2d,
            transparent
        );

    box-shadow:
        0 0 10px #ff1e2d;

    opacity:.5;
}


.side-line.left{

    left:0;
    top:38%;
}


.side-line.right{

    right:0;
    top:62%;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .login-wrapper{

        max-width:390px;

        padding:18px;
    }

    .login-box{

        padding:
            30px 21px 25px;

        border-radius:23px;
    }

    .brand-icon{

        width:70px;
        height:70px;

        font-size:33px;

        border-radius:19px;
    }

    .brand-name{

        font-size:22px;
    }

    .brand-subtitle{

        font-size:10px;
    }

    input{

        height:52px;
    }

    .login-btn{

        height:52px;
    }
}


/* =========================================
   SMALL PHONES
========================================= */

@media(max-width:360px){

    .login-wrapper{

        padding:13px;
    }

    .login-box{

        padding:
            26px 17px 22px;
    }

    .brand-icon{

        width:64px;
        height:64px;

        font-size:29px;
    }

    .brand-name{

        font-size:20px;
    }

    .admin-badge{

        margin:
            15px auto 21px;
    }

    input{

        height:49px;

        font-size:13px;
    }

    .login-btn{

        height:49px;

        font-size:14px;
    }
}

</style>

</head>


<body>


<div class="neon-bg"></div>

<div class="side-line left"></div>
<div class="side-line right"></div>


<div class="login-wrapper">

<div class="login-box">


    <!-- BRAND ICON -->

    <div class="brand-icon">
        🐦‍🔥
    </div>


    <!-- BRAND -->

    <div class="brand-name">
        PHOENIX STORE
    </div>

    <div class="brand-subtitle">
        Administration Portal
    </div>


    <!-- ADMIN BADGE -->

    <div class="admin-badge">

        <span class="admin-dot"></span>

        ADMIN SECURE ACCESS

    </div>


    <!-- EMAIL -->

    <div class="input-group">

        <span class="input-icon">
            ✉
        </span>

        <input
            type="email"
            id="email"
            placeholder="Enter Admin Email"
            autocomplete="username"
        >

    </div>


    <!-- PASSWORD -->

    <div class="input-group password-wrap">

        <span class="input-icon">
            🔐
        </span>

        <input
            type="password"
            id="password"
            placeholder="Enter Admin Password"
            autocomplete="current-password"
        >

        <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Show password">

            👁

        </button>

    </div>


    <!-- LOGIN -->

    <button
        type="button"
        class="login-btn"
        id="loginButton"
        onclick="login()">

        🔓 &nbsp; Secure Admin Login

    </button>


    <!-- SECURITY -->

    <div class="security-note">

        🔒

        <span>
            Authorized Phoenix Store administrators only
        </span>

    </div>


</div>

</div>


<script>

/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

document
.getElementById("togglePassword")
.addEventListener("click", function(){

    const password =
        document.getElementById("password");

    if(password.type === "password"){

        password.type = "text";

        this.textContent = "🙈";

        this.setAttribute(
            "aria-label",
            "Hide password"
        );

    }else{

        password.type = "password";

        this.textContent = "👁";

        this.setAttribute(
            "aria-label",
            "Show password"
        );

    }

});


/* =========================================
   ENTER KEY LOGIN
========================================= */

document
.getElementById("password")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        login();

    }

});


/* =========================================
   LOGIN BUTTON STATE
========================================= */

const originalLogin = window.login;

</script>


<!-- =========================================
     SUPABASE LOGIN
========================================= -->

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const supabase = createClient(

    "https://tvhgxlqqeklrdlgbkosa.supabase.co",

    "sb_publishable_Ep28HPF1SXIXQXBF2i__eg_h_jmjw4I",

    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }

);


window.login = async function(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    /* =====================================
       EMPTY CHECK
    ===================================== */

    if(!email || !password){

        Swal.fire({

            icon:"warning",

            title:"Missing Details",

            text:
                "Please enter your Admin Email and Password.",

            confirmButtonText:"OK",

            background:"#111113",

            color:"#fff",

            confirmButtonColor:"#ff1e2d",

            backdrop:
                "rgba(0,0,0,.82)"

        });

        return;

    }


    const button =
        document
        .getElementById("loginButton");


    button.classList.add("loading");

    button.innerHTML =
        "⏳ &nbsp; Authenticating...";


    /* =====================================
       LOGIN
    ===================================== */

    const {
        data,
        error
    } =
        await supabase.auth.signInWithPassword({

            email,
            password

        });


    /* =====================================
       LOGIN ERROR
    ===================================== */

    if(error){

        button.classList.remove("loading");

        button.innerHTML =
            "🔓 &nbsp; Secure Admin Login";


        Swal.fire({

            icon:"error",

            title:"Login Failed",

            text:
                "Invalid Email or Password",

            confirmButtonText:"Try Again",

            background:"#111113",

            color:"#fff",

            confirmButtonColor:"#ff1e2d",

            backdrop:
                "rgba(0,0,0,.82)",

            iconColor:"#ff1e2d"

        });

        return;

    }


    /* =====================================
       GET USER
    ===================================== */

    const user =
        data.user;


    /* =====================================
       ADMIN CHECK
    ===================================== */

    const {
        data:admin,
        error:adminError
    } =
        await supabase

        .from("admin_users")

        .select("id, email")

        .eq("id", user.id)

        .single();


    /* =====================================
       ACCESS DENIED
    ===================================== */

    if(adminError || !admin){

        await supabase.auth.signOut();


        button.classList.remove("loading");

        button.innerHTML =
            "🔓 &nbsp; Secure Admin Login";


        Swal.fire({

            icon:"error",

            title:"Access Denied",

            text:
                "You are not authorized to access the Admin Panel.",

            confirmButtonText:"OK",

            background:"#111113",

            color:"#fff",

            confirmButtonColor:"#ff1e2d",

            backdrop:
                "rgba(0,0,0,.82)",

            iconColor:"#ff1e2d"

        });

        return;

    }


    /* =====================================
       SUCCESS
    ===================================== */

    button.innerHTML =
        "✅ &nbsp; Access Granted";


    button.style.background =
        "linear-gradient(135deg,#16a34a,#047857)";


    setTimeout(() => {

        window.location.href =
            "admin.html";

    },500);

};

</script>

</body>
</html>
